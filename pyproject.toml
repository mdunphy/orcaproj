[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaproj"
version = "0.1.0"
description = "Python bindings for liborca, the ORCA tripolar grid library"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["orcaproj"]

